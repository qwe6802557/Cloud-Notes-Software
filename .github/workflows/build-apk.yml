name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cloud-notes-mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        working-directory: cloud-notes-mobile
        run: npm ci

      - name: Run Expo Prebuild
        working-directory: cloud-notes-mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build Release APK with Gradle
        working-directory: cloud-notes-mobile/android
        run: |
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
            -Dorg.gradle.parallel=false \
            --no-daemon

      - name: Rename & Prepare APK Artifact
        run: |
          mkdir -p build-output
          cp cloud-notes-mobile/android/app/build/outputs/apk/release/app-release.apk build-output/cloud-notes-v1.0.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-notes-v1.0.2-apk
          path: build-output/cloud-notes-v1.0.2.apk
          retention-days: 30
